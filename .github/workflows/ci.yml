name: CI

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed commit SHA for a notarized localhost update pilot
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AGENT_SECRET_MISE_VERSION: "2026.4.28"
  AGENT_SECRET_MISE_SHA256_MACOS_ARM64: f0f5fa48643a00442c8cc066f8350285896561f2491bcbbee93b1a9a8249816d

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, Test, Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/checks/install-ci-mise.sh

      - name: Trust mise config
        run: mise trust --yes

      - name: Install project dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run setup

      - name: Run lints and tests
        run: mise run lint

      - name: Build commands and app bundle
        run: mise run build

  smoke-tests:
    name: Smoke Tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/checks/install-ci-mise.sh

      - name: Trust mise config
        run: mise trust --yes

      - name: Install project dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run setup

      - name: Run non-secret smoke tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run test:smoke

  signed-update-pilot:
    name: Build Notarized Update Pilot (arm64)
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.candidate_sha != ''
    needs: [lint-test-build, smoke-tests]
    runs-on: macos-latest
    environment: agent-secret-candidate-signing
    steps:
      - name: Verify reviewed candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_SIGNING_ENABLED: ${{ vars.AGENT_SECRET_CANDIDATE_SIGNING_ENABLED }}
        run: |
          if [[ "$CANDIDATE_SIGNING_ENABLED" != true || "$CANDIDATE_SHA" != "$GITHUB_SHA" ]]; then
            echo "Enable the protected pilot environment and dispatch its reviewed commit SHA." >&2
            exit 1
          fi

      - name: Check out the reviewed commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install mise
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/checks/install-ci-mise.sh

      - name: Install project dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise trust --yes
          mise run setup

      - name: Verify pilot signing configuration
        env:
          AGENT_SECRET_CODESIGN_CERT_P12_BASE64: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_P12_BASE64 }}
          AGENT_SECRET_CODESIGN_CERT_PASSWORD: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_PASSWORD }}
          AGENT_SECRET_CODESIGN_IDENTITY: ${{ secrets.AGENT_SECRET_CODESIGN_IDENTITY }}
          AGENT_SECRET_NOTARIZE: "1"
          AGENT_SECRET_NOTARY_ISSUER_ID: ${{ secrets.AGENT_SECRET_NOTARY_ISSUER_ID }}
          AGENT_SECRET_NOTARY_KEY: ${{ secrets.AGENT_SECRET_NOTARY_KEY }}
          AGENT_SECRET_NOTARY_KEY_ID: ${{ secrets.AGENT_SECRET_NOTARY_KEY_ID }}
        run: scripts/release/check-release-signing-env.sh

      - name: Import Developer ID certificate
        env:
          AGENT_SECRET_CODESIGN_CERT_P12_BASE64: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_P12_BASE64 }}
          AGENT_SECRET_CODESIGN_CERT_PASSWORD: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_PASSWORD }}
        run: scripts/release/import-codesign-certificate.sh

      - name: Build and notarize both localhost pilot DMGs
        env:
          AGENT_SECRET_CODESIGN_IDENTITY: ${{ secrets.AGENT_SECRET_CODESIGN_IDENTITY }}
          AGENT_SECRET_NOTARIZE: "1"
          AGENT_SECRET_NOTARY_ISSUER_ID: ${{ secrets.AGENT_SECRET_NOTARY_ISSUER_ID }}
          AGENT_SECRET_NOTARY_KEY: ${{ secrets.AGENT_SECRET_NOTARY_KEY }}
          AGENT_SECRET_NOTARY_KEY_ID: ${{ secrets.AGENT_SECRET_NOTARY_KEY_ID }}
        run: |
          export AGENT_SECRET_TRUSTED_MISE="$HOME/.local/share/mise/bin/mise"
          export AGENT_SECRET_IN_MISE=1
          "$AGENT_SECRET_TRUSTED_MISE" exec -- scripts/release/smoke-app-update.sh _dist/update-pilot

      - name: Upload localhost pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notarized-update-pilot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: _dist/update-pilot/

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        run: |
          keychain_path="$RUNNER_TEMP/agent-secret-codesign.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi

  draft-release-artifacts:
    name: Build Release Artifact (arm64)
    if: startsWith(github.ref, 'refs/tags/v') && inputs.candidate_sha == ''
    runs-on: macos-latest
    environment: agent-secret-release-signing
    steps:
      - name: Check out trusted release guards
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: _trusted-main
          fetch-depth: 0

      - name: Verify release tag ancestry
        working-directory: _trusted-main
        run: scripts/release/check-release-ancestry.sh "$GITHUB_REF_NAME"

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify changelog release notes
        run: scripts/release/extract-release-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Install mise
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/checks/install-ci-mise.sh

      - name: Trust mise config
        run: mise trust --yes

      - name: Install project dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run setup

      - name: Verify release signing configuration
        env:
          AGENT_SECRET_CODESIGN_CERT_P12_BASE64: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_P12_BASE64 }}
          AGENT_SECRET_CODESIGN_CERT_PASSWORD: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_PASSWORD }}
          AGENT_SECRET_CODESIGN_IDENTITY: ${{ secrets.AGENT_SECRET_CODESIGN_IDENTITY }}
          AGENT_SECRET_NOTARIZE: ${{ secrets.AGENT_SECRET_NOTARIZE }}
          AGENT_SECRET_NOTARY_ISSUER_ID: ${{ secrets.AGENT_SECRET_NOTARY_ISSUER_ID }}
          AGENT_SECRET_NOTARY_KEY: ${{ secrets.AGENT_SECRET_NOTARY_KEY }}
          AGENT_SECRET_NOTARY_KEY_ID: ${{ secrets.AGENT_SECRET_NOTARY_KEY_ID }}
        run: scripts/release/check-release-signing-env.sh

      - name: Import Developer ID certificate
        env:
          AGENT_SECRET_CODESIGN_CERT_P12_BASE64: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_P12_BASE64 }}
          AGENT_SECRET_CODESIGN_CERT_PASSWORD: ${{ secrets.AGENT_SECRET_CODESIGN_CERT_PASSWORD }}
        run: scripts/release/import-codesign-certificate.sh

      - name: Build release artifacts
        env:
          AGENT_SECRET_UPDATE_FEED_URL: ${{ vars.AGENT_SECRET_UPDATE_FEED_URL }}
          AGENT_SECRET_UPDATE_PUBLIC_KEY: ${{ vars.AGENT_SECRET_UPDATE_PUBLIC_KEY }}
          AGENT_SECRET_CODESIGN_IDENTITY: ${{ secrets.AGENT_SECRET_CODESIGN_IDENTITY }}
          AGENT_SECRET_NOTARIZE: ${{ secrets.AGENT_SECRET_NOTARIZE }}
          AGENT_SECRET_NOTARY_ISSUER_ID: ${{ secrets.AGENT_SECRET_NOTARY_ISSUER_ID }}
          AGENT_SECRET_NOTARY_KEY: ${{ secrets.AGENT_SECRET_NOTARY_KEY }}
          AGENT_SECRET_NOTARY_KEY_ID: ${{ secrets.AGENT_SECRET_NOTARY_KEY_ID }}
        run: |
          trusted_mise="$HOME/.local/share/mise/bin/mise"
          test -x "$trusted_mise"
          AGENT_SECRET_IN_MISE=1 \
            AGENT_SECRET_TRUSTED_MISE="$trusted_mise" \
            "$trusted_mise" exec -- scripts/release/build-release.sh "$GITHUB_REF_NAME" --require-production-signing

      - name: Sign the update feed for the candidate DMG
        if: vars.AGENT_SECRET_UPDATE_FEED_URL != ''
        env:
          AGENT_SECRET_UPDATE_PUBLIC_KEY: ${{ vars.AGENT_SECRET_UPDATE_PUBLIC_KEY }}
          AGENT_SECRET_UPDATE_SIGNING_KEY: ${{ secrets.AGENT_SECRET_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$AGENT_SECRET_UPDATE_SIGNING_KEY"
          printf '%s' "$AGENT_SECRET_UPDATE_SIGNING_KEY" |
            env -u AGENT_SECRET_UPDATE_SIGNING_KEY mise exec -- scripts/release/generate-update-feed.sh \
              "$GITHUB_REF_NAME" "_dist/Agent-Secret-${GITHUB_REF_NAME}-macos-arm64.dmg" \
              "$RUNNER_TEMP/release-notes.md" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Verify release artifact architecture
        run: |
          test "$(uname -m)" = "arm64"
          test -f "_dist/Agent-Secret-${GITHUB_REF_NAME}-macos-arm64.dmg"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-arm64
          if-no-files-found: error
          path: |
            _dist/Agent-Secret-${{ github.ref_name }}-macos-arm64.dmg
            _dist/checksums.txt
            _dist/appcast.xml

      - name: Delete temporary signing keychain
        if: ${{ always() }}
        run: |
          keychain_path="$RUNNER_TEMP/agent-secret-codesign.keychain-db"
          if [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi

  publish-draft-release:
    name: Publish Draft Release
    if: startsWith(github.ref, 'refs/tags/v') && inputs.candidate_sha == ''
    runs-on: ubuntu-latest
    needs: draft-release-artifacts
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: _dist/release-artifacts
          pattern: release-*

      - name: Assemble release assets
        run: |
          mkdir -p _dist
          cp "_dist/release-artifacts/release-arm64/Agent-Secret-${GITHUB_REF_NAME}-macos-arm64.dmg" _dist/
          cp "_dist/release-artifacts/release-arm64/checksums.txt" _dist/checksums.txt
          if [[ -f _dist/release-artifacts/release-arm64/appcast.xml ]]; then
            cp _dist/release-artifacts/release-arm64/appcast.xml _dist/
          fi
          scripts/release/prepare-bootstrap-scripts.sh "$GITHUB_REF_NAME" _dist

      - name: Extract changelog release notes
        run: scripts/release/extract-release-notes.sh "$GITHUB_REF_NAME" _dist/release-notes.md

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_SECRET_RELEASE_NOTES_FILE: _dist/release-notes.md
        run: |
          assets=()
          if [[ -f _dist/appcast.xml ]]; then
            assets+=("_dist/appcast.xml")
          fi
          scripts/release/publish-draft-release.sh "$GITHUB_REF_NAME" \
            "_dist/Agent-Secret-${GITHUB_REF_NAME}-macos-arm64.dmg" \
            "_dist/checksums.txt" \
            "_dist/install.sh" \
            "_dist/uninstall.sh" "${assets[@]}"
